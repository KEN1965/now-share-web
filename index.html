<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Share</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Now Share</h1>
    <p class="subtitle">発表者が共有したURLをここに表示します</p>

    <section id="roomSection" class="card">
      <p class="label">ROOMコードを入力</p>

      <input
        id="roomInput"
        type="text"
        placeholder="例：AI2026"
        autocomplete="off"
      />

      <button id="joinButton">参加する</button>
    </section>

    <section id="shareSection" class="card hidden">
      <p class="label">参加中のROOM</p>
      <p id="currentRoom">AI2026</p>

      <hr />

      <p class="label">現在共有中</p>
      <h2 id="pageTitle">まだ共有されていません</h2>
      <p id="sharedUrl">発表者がURLを共有すると、ここに表示されます。</p>

      <a id="openButton" href="#" target="_blank">
        このページを開く
      </a>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
